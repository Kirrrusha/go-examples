syntax = "proto3";

package account;

option go_package = "account/pkg/account/go;account";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pagination/pagination.proto";

service Account {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);
  rpc UpdateUser(UpdateUserRequest) returns (google.protobuf.Empty);
  rpc Deposit(DepositRequest) returns (DepositResponse);
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);
  rpc Transfer(TransferRequest) returns (TransferResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
}

message CreateUserRequest {
  CreateUser user = 1;
}

message CreateUserResponse {
  User user = 1;
}

message CreateUser {
  string login = 1;
  string phone = 2;
  string first_name = 3;
  string last_name = 4;
  string middle_name = 5;
  string email = 6;
  uint32 age = 7;
  int64 balance = 8;
  string password = 9;
}

message UpdateUserRequest {
  uint64 user_id = 1;
  UpdateUser user = 2;
}

message UpdateUser {
  string phone = 1;
  string first_name = 2;
  string last_name = 3;
  string middle_name = 4;
  string email = 5;
  uint32 age = 6;
  int64 balance = 7;
}

message GetUserRequest {
  uint64 user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetUsersRequest {
  pagination.Pagination pagination = 1;
}

message GetUsersResponse {
  repeated User users = 1;
  pagination.Pagination pagination = 2;
}

message DeleteUserRequest {
  uint64 user_id = 1;
}

message User {
  uint64 id = 1;
  string login = 2;
  string phone = 3;
  string first_name = 4;
  string last_name = 5;
  string middle_name = 6;
  string email = 7;
  uint32 age = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  int64 balance = 11;
  bool is_deleted = 12;
}

message DepositRequest {
  uint64 user_id = 1;
  int64 amount = 2;
  string operation_id = 3;
}

message DepositResponse {
  string status = 1;
  int64 balance = 2;
}

message WithdrawRequest {
  uint64 user_id = 1;
  int64 amount = 2;
  string operation_id = 3;
}

message WithdrawResponse {
  string status = 1;
  int64 balance = 2;
}

message TransferRequest {
  uint64 user_id = 1;
  uint64 recipient_id = 2;
  int64 amount = 3;
  string operation_id = 4;
}

message TransferResponse {
  string status = 1;
  int64 user_balance = 2;
  int64 recipient_balance = 3;
}

message GetBalanceRequest {
  uint64 user_id = 1;
}

message GetBalanceResponse {
  int64 balance = 1;
}
