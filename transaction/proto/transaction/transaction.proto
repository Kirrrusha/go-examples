syntax = "proto3";

package transaction;

option go_package = "transaction/pkg/transaction/go;transaction";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pagination/pagination.proto";

service TransactionService {
  rpc Deposit(DepositRequest) returns (google.protobuf.Empty);
  rpc Withdraw(WithdrawRequest) returns (google.protobuf.Empty);
  rpc Transfer(TransferRequest) returns (google.protobuf.Empty);
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);
}

message DepositRequest {
  uint64 user_id = 1;
  int64 amount = 2;
}

message WithdrawRequest {
  uint64 user_id = 1;
  int64 amount = 2;
}

message TransferRequest {
  uint64 user_id = 1;
  int64 amount = 2;
  uint64 recipient = 3;
}

message GetTransactionsRequest {
  optional uint64 user_id = 1;
  optional string type = 2;
  optional string status = 3;
  optional google.protobuf.Timestamp date_from = 4;
  optional google.protobuf.Timestamp date_to = 5;
  optional pagination.Pagination pagination = 6;
}

message GetTransactionsResponse {
  repeated TransactionDetails transactions = 1;
}

message Transaction {
  uint64 id = 1;
  uint64 user_id = 2;
  int64 amount = 3;
  string type = 4;
  string status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message TransactionEntry {
  uint64 id = 1;
  uint64 transaction_id = 2;
  uint64 account_id = 3;
  string direction = 4;
  int64 amount = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message TransactionDetails {
  Transaction transaction = 1;
  repeated TransactionEntry entries = 2;
}
